<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenMontage 验证</title>
<style>
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #111;
  color: #eee;
  font: 15px system-ui, sans-serif;
}
main { width: min(420px, calc(100vw - 40px)); }
h1 { font-size: 22px; }
p { color: #aaa; line-height: 1.6; }
input, button {
  box-sizing: border-box;
  width: 100%;
  height: 44px;
  border-radius: 6px;
}
input {
  border: 1px solid #444;
  background: #191919;
  color: #fff;
  padding: 0 12px;
}
button {
  margin-top: 12px;
  border: 0;
  background: #2f7df6;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}
#error { min-height: 22px; color: #ff7777; }
</style>
</head>
<body>
<main>
  <h1>OpenMontage</h1>
  <p>使用 Models API Key 验证后查看 CI 上的只读制作看板。</p>
  <form id="login">
    <input id="key" type="password" autocomplete="current-password"
           placeholder="MODELS_API_KEY" required>
    <button type="submit">验证并进入</button>
  </form>
  <p id="error" role="alert"></p>
</main>
<script>
const base = __BACKLOT_BASE_PATH_JSON__;
document.getElementById("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  const key = document.getElementById("key");
  const error = document.getElementById("error");
  error.textContent = "";
  const response = await fetch(`${base}/auth/session`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey: key.value }),
  });
  key.value = "";
  if (response.ok) {
    location.replace(`${base}/`);
    return;
  }
  error.textContent = response.status === 401
    ? "API Key 无效"
    : "验证服务暂不可用，请稍后重试";
});
</script>
</body>
</html>
