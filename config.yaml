# OpenMontage - Global Configuration

llm:
  provider: dofe                 # unified models.dofe.ai router
  protocol: openai               # openai | openai_response | anthropic | gemini
  base_url: https://model.local.dofe.ai/api
  api_key_env: DOFE_MODEL_API_KEY
  model: null                    # select an exact ID from authenticated GET /v1/models
  temperature: 0.7
  max_tokens: 4096

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
