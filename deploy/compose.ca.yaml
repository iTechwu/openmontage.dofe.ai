services:
  openmontage-mcp:
    environment:
      DOFE_CA_BUNDLE: /run/secrets/dofe-ca.pem
    volumes:
      - type: bind
        source: ${DOFE_CA_BUNDLE_HOST:?Set this only when ixicai.cn uses a private CA}
        target: /run/secrets/dofe-ca.pem
        read_only: true

  openmontage-cli:
    environment:
      DOFE_CA_BUNDLE: /run/secrets/dofe-ca.pem
    volumes:
      - type: bind
        source: ${DOFE_CA_BUNDLE_HOST:?Set this only when ixicai.cn uses a private CA}
        target: /run/secrets/dofe-ca.pem
        read_only: true
