name: openmontage

x-openmontage-common: &openmontage-common
  platform: ${OPENMONTAGE_PLATFORM:-linux/amd64}
  build:
    context: .
    args:
      OPENMONTAGE_IMAGE_REVISION: ${OPENMONTAGE_IMAGE_REVISION:-unknown}
  image: openmontage:local
  shm_size: "512mb"
  security_opt:
    - apparmor=unconfined
  privileged: true
  user: root
  env_file:
    - path: .env
      required: false
  environment:
    OPENMONTAGE_PROJECTS_DIR: /data/projects
    OPENMONTAGE_JOB_DB: /data/projects/.openmontage/jobs.sqlite3
    OPENMONTAGE_MCP_HOST: 0.0.0.0
    OPENMONTAGE_MCP_PORT: 8765
    OPENMONTAGE_SERVICE_TOKEN: ${OPENMONTAGE_SERVICE_TOKEN:?Set OPENMONTAGE_SERVICE_TOKEN in .env}
    # The public MCP gateway authenticates with the Models API key and passes
    # this signed context to OpenMontage. Keep the service gateway-only so the
    # host-published 8765 port cannot be used as an unauthenticated bypass.
    OPENMONTAGE_MCP_GATEWAY_SECRET: ${OPENMONTAGE_MCP_GATEWAY_SECRET:?Set OPENMONTAGE_MCP_GATEWAY_SECRET in .env}
    OPENMONTAGE_MCP_GATEWAY_ONLY: ${OPENMONTAGE_MCP_GATEWAY_ONLY:-true}
    # Client-stage-only mode (plan §13): the legacy Worker is disabled — every
    # pipeline stage is advanced by the client Agent through the client Stage
    # API (begin/update/submit_client_stage), never by claim_job. A Job stays
    # QUEUED after creation until the client begins its first stage.
    OPENMONTAGE_CLIENT_STAGE_ONLY: ${OPENMONTAGE_CLIENT_STAGE_ONLY:-true}
    OPENMONTAGE_EVENT_ENDPOINT: ${OPENMONTAGE_EVENT_ENDPOINT-http://host.docker.internal:1455/api/internal/openmontage/events}
    OPENMONTAGE_ARTIFACT_BRIDGE_BASE_URL: ${OPENMONTAGE_ARTIFACT_BRIDGE_BASE_URL:-http://host.docker.internal:1455}
    OPENMONTAGE_MODEL_CREDENTIAL_BASE_URL: ${OPENMONTAGE_MODEL_CREDENTIAL_BASE_URL-http://host.docker.internal:1455}
    # Model traffic and auth-context validation use the shared public gateway.
    DOFE_MODEL_BASE_URL: ${DOFE_DOCKER_MODEL_BASE_URL:-https://ixicai.cn/api}
    DOFE_INTERNAL_API_BASE_URL: ${DOFE_DOCKER_INTERNAL_API_BASE_URL:-https://ixicai.cn/api}
    OPENMONTAGE_EVENT_SIGNING_SECRET: ${OPENMONTAGE_EVENT_SIGNING_SECRET:?Set OPENMONTAGE_EVENT_SIGNING_SECRET in .env}
    OPENMONTAGE_EVENT_MAX_ATTEMPTS: ${OPENMONTAGE_EVENT_MAX_ATTEMPTS:-20}
    OPENMONTAGE_EVENT_NOT_FOUND_MAX_ATTEMPTS: ${OPENMONTAGE_EVENT_NOT_FOUND_MAX_ATTEMPTS:-5}
    # On-demand project-file export through the shared mcp-file-server so the
    # workspace agent can read generated files (it cannot see /data/projects).
    # Both unset => disabled (local dev keeps container paths).
    # Base URL uses 127.0.0.1 (not host.docker.internal) so the DSH harness, which
    # runs in host-network mode and cannot resolve host.docker.internal, can reach
    # the shared file-server. OpenMontage only builds this string; it never fetches it.
    OPENMONTAGE_EXPORT_DIR: ${OPENMONTAGE_EXPORT_DIR:-/data/mcp-exchange/openmontage}
    OPENMONTAGE_FILE_SERVER_BASE_URL: ${OPENMONTAGE_FILE_SERVER_BASE_URL:-http://127.0.0.1:18090}
    OPENMONTAGE_EXPORT_PREFIX: ${OPENMONTAGE_EXPORT_PREFIX:-openmontage}
    DOFE_ENABLED: "true"
    DOFE_CA_BUNDLE: ${DOFE_CA_BUNDLE:-}
  volumes:
    - ./projects:/data/projects
    - ./music_library:/data/music_library
    # Shared exchange dir (mcp-file-server) so project files can be mirrored on
    # demand for the workspace agent via /exchange or http://host.docker.internal:18090.
    # The host path is overridable so machines without a shared /data root can
    # point it at a checkout-local directory via .env.
    - ${OPENMONTAGE_EXCHANGE_HOST_DIR:-/data/mcp-exchange}:/data/mcp-exchange
    # Overlay the container config with the checked-out public model gateway settings.
    - ./config.yaml:/app/config.yaml:ro
  networks:
    - dofe-models
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  openmontage-mcp:
    <<: *openmontage-common
    command: ["mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "${OPENMONTAGE_MCP_PORT:-8765}:8765"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8765/healthz >/dev/null &&
          curl -fsS --connect-timeout 5 --max-time 10
          -H "Authorization: Bearer $${DOFE_MODEL_API_KEY}"
          "$${DOFE_MODEL_BASE_URL}/v1/models" >/dev/null
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  openmontage-backlot:
    platform: ${OPENMONTAGE_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        OPENMONTAGE_IMAGE_REVISION: ${OPENMONTAGE_IMAGE_REVISION:-unknown}
    image: openmontage:local
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "backlot"]
    command: ["serve", "--host", "0.0.0.0", "--port", "4750"]
    environment:
      OPENMONTAGE_PROJECTS_DIR: /data/projects
      OPENMONTAGE_BACKLOT_CACHE_DIR: /data/cache/backlot
      OPENMONTAGE_BACKLOT_BASE_PATH: ${OPENMONTAGE_BACKLOT_BASE_PATH:-/montage}
      OPENMONTAGE_BACKLOT_AUTH_URL: ${OPENMONTAGE_BACKLOT_AUTH_URL:-https://ixicai.cn/api/internal/mcp/auth-context}
      OPENMONTAGE_BACKLOT_SECURE_COOKIE: "true"
    volumes:
      - ./projects:/data/projects:ro
    tmpfs:
      - /data/cache/backlot:size=256m
    networks:
      - dofe-models
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${OPENMONTAGE_BACKLOT_PORT:-14750}:4750"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4750/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  openmontage-cli:
    <<: *openmontage-common
    profiles: ["tools"]
    command: ["--help"]

  openmontage-events:
    <<: *openmontage-common
    profiles: ["agentspace"]
    command: ["events", "publish", "--interval", "2", "--json"]
    healthcheck:
      disable: true
    restart: unless-stopped
  # MCP-only deployment: the openmontage-worker is intentionally NOT a compose
  # service. It runs on the host via openmontage/delegation_proxy.py (see
  # DOCKER_AND_AGENTS.md). add a worker here only if you want pipeline execution
  # inside a container replica.
networks:
  dofe-models:
    external: true
    name: ${DOFE_DOCKER_NETWORK:-modelsdofeai_default}
